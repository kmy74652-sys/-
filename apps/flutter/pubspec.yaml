name: alshaeri_mobile
description: NEXORA — Smart Business Management.
publish_to: "none"
version: 0.1.0+5
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.3.5
  connectivity_plus: ^6.1.1
  file_picker: ^13.4.1
  image_picker: ^1.1.2
  mime: ^2.1.0
  intl: ^0.20.2
  app_links: ^7.2.2
  flutter_local_notifications: ^18.0.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.13.4
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/NotoSansArabic-Bold.ttf
  fonts:
    - family: AlshaeriArabic
      fonts:
        - asset: assets/fonts/AlshaeriArabic-Regular.ttf
