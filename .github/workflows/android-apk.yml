name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/mobile/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    name: Build Alshaeri APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # A Supabase publishable key is intended for client apps; never place a service-role key here.
      EXPO_PUBLIC_SUPABASE_URL: https://fjmryqhdwxsocdzswnkq.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_vRWbeJO5I_KJwJjqVDSZLA_pEHABsPk
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android build configuration
        run: |
          missing=0
          for key in EXPO_PUBLIC_API_BASE_URL; do
            if [ -z "${!key}" ]; then
              echo "::error title=Missing repository secret::$key must be configured before building an APK."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          supabase_url="${EXPO_PUBLIC_SUPABASE_URL%/}"
          if [ "$supabase_url" != "https://fjmryqhdwxsocdzswnkq.supabase.co" ]; then
            echo "::error title=Wrong Supabase project::EXPO_PUBLIC_SUPABASE_URL does not match the requested project."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 20 \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_ANON_KEY" \
            "$supabase_url/auth/v1/health" >/dev/null
          api_status="$(curl --silent --show-error --max-time 20 \
            --output /tmp/alshaeri-api-health.json --write-out '%{http_code}' \
            "${EXPO_PUBLIC_API_BASE_URL%/}/api/health" || printf '000')"
          if [ "$api_status" != "200" ] || ! grep -q '"service":"alshaeri-api"' /tmp/alshaeri-api-health.json 2>/dev/null; then
            echo "::warning title=API endpoint not verified::The configured API URL did not return the expected public health response (HTTP $api_status). APK will build, but API-backed sign-in/data operations may not work until this endpoint is corrected."
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install --clean
        env:
          NODE_ENV: production

      - name: Build release APK
        run: cd android && ./gradlew --no-daemon --stacktrace assembleRelease
        env:
          NODE_ENV: production

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alshaeri-preview-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
