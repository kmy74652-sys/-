name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/mobile/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    name: Build Alshaeri APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # A Supabase publishable key is intended for client apps; never place a service-role key here.
      EXPO_PUBLIC_SUPABASE_URL: https://fjmryqhdwxsocdzswnkq.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_vRWbeJO5I_KJwJjqVDSZLA_pEHABsPk
      EXPO_USE_COMMUNITY_AUTOLINKING: '0'
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android build configuration
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error title=Missing Supabase publishable key::Set the public Supabase key before building."
            exit 1
          fi
          supabase_url="${EXPO_PUBLIC_SUPABASE_URL%/}"
          if [ "$supabase_url" != "https://fjmryqhdwxsocdzswnkq.supabase.co" ]; then
            echo "::error title=Wrong Supabase project::EXPO_PUBLIC_SUPABASE_URL does not match the requested project."
            exit 1
          fi
          if rg -n 'EXPO_PUBLIC_API_BASE_URL|/api/' app lib; then
            echo "::error title=External API reference found::The mobile client must use Supabase directly."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 20 \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_ANON_KEY" \
            "$supabase_url/auth/v1/health" >/dev/null

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install --clean
        env:
          NODE_ENV: production

      - name: Build release APK
        run: |
          autolinking="$(pnpm exec expo-modules-autolinking resolve --platform android --json)"
          printf '%s' "$autolinking" | node -e 'let text="";process.stdin.on("data",chunk=>text+=chunk);process.stdin.on("end",()=>{const result=JSON.parse(text);const linking=result.modules?.find(item=>item.packageName==="expo-linking");if(!linking||!linking.modules?.includes("expo.modules.linking.ExpoLinkingModule")){console.error("Expo Linking is not registered for Android autolinking.");process.exit(1)}console.log("Expo Linking module detected.")})'
          cd android
          ./gradlew --no-daemon :app:generateAutolinkingPackageList
          package_list=app/build/generated/autolinking/src/main/java/com/facebook/react/PackageList.java
          if grep -q 'import expo.core.ExpoModulesPackage;' "$package_list"; then
            sed -i 's/import expo\.core\.ExpoModulesPackage;/import expo.modules.ExpoModulesPackage;/' "$package_list"
          fi
          grep -q 'import expo.modules.ExpoModulesPackage;' "$package_list"
          ./gradlew --no-daemon --stacktrace -x :app:generateAutolinkingPackageList assembleRelease
        env:
          NODE_ENV: production

      - name: Best-effort install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/scripts/smoke-android.sh"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alshaeri-preview-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
