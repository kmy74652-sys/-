name: Build Android APK
run-name: Build APK · ${{ github.ref_name }}

on:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # A Supabase publishable key is intended for client apps; never place a service-role key here.
      EXPO_PUBLIC_SUPABASE_URL: https://fjmryqhdwxsocdzswnkq.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_vRWbeJO5I_KJwJjqVDSZLA_pEHABsPk
      EXPO_USE_COMMUNITY_AUTOLINKING: '0'
      NODE_ENV: production
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android build configuration
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error title=Missing Supabase publishable key::Set the public Supabase key before building."
            exit 1
          fi
          supabase_url="${EXPO_PUBLIC_SUPABASE_URL%/}"
          if [ "$supabase_url" != "https://fjmryqhdwxsocdzswnkq.supabase.co" ]; then
            echo "::error title=Wrong Supabase project::EXPO_PUBLIC_SUPABASE_URL does not match the requested project."
            exit 1
          fi
          if grep -R -n -E -- 'EXPO_PUBLIC_API_BASE_URL|/api/' app lib; then
            echo "::error title=External API reference found::The mobile client must use Supabase directly."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 20 \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_ANON_KEY" \
            "$supabase_url/auth/v1/health" >/dev/null

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Cache pnpm package store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-node22-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-node22-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle and Android dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            ~/.android/cache
            ~/.android/build-cache
            apps/mobile/android/.gradle
          key: ${{ runner.os }}-android-node22-java17-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/package.json', 'apps/mobile/app.json', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-node22-java17-
            ${{ runner.os }}-android-

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        working-directory: .

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Prepare and build release APK
        run: |
          set -euo pipefail
          # Direct-install APK: modern Android devices use arm64-v8a.
          # Excluding duplicate x86/32-bit native libraries reduces APK size substantially.
          export ORG_GRADLE_PROJECT_reactNativeArchitectures=arm64-v8a
          autolinking="$(pnpm exec expo-modules-autolinking resolve --platform android --json)"
          printf '%s' "$autolinking" | node -e 'let text="";process.stdin.on("data",chunk=>text+=chunk);process.stdin.on("end",()=>{const result=JSON.parse(text);const linking=result.modules?.find(item=>item.packageName==="expo-linking");if(!linking||!linking.modules?.includes("expo.modules.linking.ExpoLinkingModule")){console.error("Expo Linking is not registered for Android autolinking.");process.exit(1)}console.log("Expo Linking module detected.")})'
          cd android
          ./gradlew --no-daemon --parallel --build-cache -PreactNativeArchitectures=arm64-v8a :app:generateAutolinkingPackageList
          package_list=app/build/generated/autolinking/src/main/java/com/facebook/react/PackageList.java
          if grep -q 'import expo.core.ExpoModulesPackage;' "$package_list"; then
            sed -i 's/import expo\.core\.ExpoModulesPackage;/import expo.modules.ExpoModulesPackage;/' "$package_list"
          fi
          grep -q 'import expo.modules.ExpoModulesPackage;' "$package_list"
          ./gradlew --no-daemon --parallel --build-cache -PreactNativeArchitectures=arm64-v8a -x :app:generateAutolinkingPackageList :app:assembleRelease

      - name: Copy APK to a stable output path
        run: |
          mkdir -p ../artifacts
          cp android/app/build/outputs/apk/release/app-release.apk ../artifacts/alshaeri-release.apk
          test -s ../artifacts/alshaeri-release.apk
          ls -lh ../artifacts/alshaeri-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alshaeri-release-apk
          path: apps/artifacts/alshaeri-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alshaeri-build-${{ github.run_number }}
          name: برنامج الشاعري - Android APK build ${{ github.run_number }}
          body: |
            نسخة Android الرسمية المبنية من الفرع main بعد آخر التعديلات.
            يحتوي الإصدار على ملف APK الجاهز للتثبيت والاختبار الفعلي.
          files: apps/artifacts/alshaeri-release.apk
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
