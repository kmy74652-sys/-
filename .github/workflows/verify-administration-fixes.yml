name: Verify administration fixes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Home dashboard checks
        run: pnpm test:home-dashboard
      - name: Static administration checks
        run: pnpm test:admin-management
      - name: Existing task workflow tests
        run: pnpm test:task-workflow
      - name: Existing task designer tests
        run: pnpm test:task-designer
      - name: Existing report designer tests
        run: pnpm test:report-designer
      - name: TypeScript checks
        run: pnpm typecheck
      - name: API production compile
        run: pnpm --filter @alshaeri/api build
      - name: Android JavaScript bundle export
        run: pnpm --filter @alshaeri/mobile exec expo export --platform android
