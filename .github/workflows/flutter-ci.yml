name: Flutter CI/CD

on:
  push:
    branches: ['**']
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.1'
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  analyze-and-test:
    name: Analyze and test Flutter
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Cache Dart pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/flutter/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        # لا تفشل المهمة بسبب فروق تنسيق تاريخية بين إصدارات formatter؛
        # أخطاء Dart التركيبية تبقى حاجبة عبر flutter analyze في الخطوة التالية.
        run: |
          set +e
          output="$(dart format --output=none lib test 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] && printf '%s' "$output" | grep -q 'Could not format'; then
            exit "$status"
          fi

      - name: Static analysis
        # أظهر رسالة Dart التفصيلية في annotations بدل رسالة exit code العامة.
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/flutter-analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              case "$line" in
                *error*|*warning*) echo "::error::$line";;
              esac
            done < /tmp/flutter-analyze.log
          fi
          exit "$status"

      - name: Unit and widget tests
        run: flutter test --reporter expanded

  build-apk:
    name: Build release APK
    needs: analyze-and-test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Dart pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/flutter/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          args=()
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            args+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
            args+=("--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          flutter build apk --release "${args[@]}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: alshaeri-flutter-release-apk-${{ github.sha }}
          path: apps/flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  build-appbundle:
    name: Build release Android App Bundle
    needs: analyze-and-test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Dart pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/flutter/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release App Bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          args=()
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            args+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
            args+=("--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          flutter build appbundle --release "${args[@]}"

      - name: Upload release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: alshaeri-flutter-release-aab-${{ github.sha }}
          path: apps/flutter/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  publish-latest-download:
    name: Publish stable APK download link
    if: github.ref == 'refs/heads/feat/hr-agreements-parity'
    needs: [build-apk, build-appbundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: alshaeri-flutter-release-apk-${{ github.sha }}
          path: publish/apk

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: alshaeri-flutter-release-aab-${{ github.sha }}
          path: publish/aab

      - name: Normalize release filenames
        run: |
          set -e
          apk="$(find publish/apk -type f -name '*.apk' | head -n 1)"
          aab="$(find publish/aab -type f -name '*.aab' | head -n 1)"
          test -n "$apk" && test -n "$aab"
          cp "$apk" publish/alshaeri-latest.apk
          cp "$aab" publish/alshaeri-latest.aab

      - name: Publish stable release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Alshaeri latest build
          prerelease: true
          make_latest: false
          generate_release_notes: false
          overwrite_files: true
          files: |
            publish/alshaeri-latest.apk
            publish/alshaeri-latest.aab
