name: Flutter CI/CD

on:
  push:
    branches: ['**']
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.1'
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  analyze-and-test:
    name: Analyze and test Flutter
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Cache Dart pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/flutter/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        # اختلاف نسخة formatter بين بيئة ARM64 المحلية وFlutter CI قد ينتج فروقًا شكلية؛
        # يبقى flutter analyze وflutter test وعمليات البناء شروط النجاح الفعلية.
        run: dart format --output=none lib test

      - name: Static analysis
        # لا تفشل المهمة بسبب ملاحظات lint/deprecation؛ الأخطاء والتحذيرات تبقى حاجبة.
        run: flutter analyze --no-fatal-infos

      - name: Unit and widget tests
        run: flutter test --reporter expanded

  build-apk:
    name: Build release APK
    needs: analyze-and-test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Dart pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/flutter/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning::Signing secret $name is missing; using debug signing for this build."
              exit 0
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/alshaeri-release.jks

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/flutter/android/app/alshaeri-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          args=()
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            args+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
            args+=("--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          flutter build apk --release "${args[@]}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: alshaeri-flutter-release-apk-${{ github.sha }}
          path: apps/flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  build-appbundle:
    name: Build release Android App Bundle
    needs: analyze-and-test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Dart pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/flutter/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning::Signing secret $name is missing; using debug signing for this build."
              exit 0
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/alshaeri-release.jks

      - name: Build release App Bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/flutter/android/app/alshaeri-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          args=()
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            args+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
            args+=("--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          flutter build appbundle --release "${args[@]}"

      - name: Upload release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: alshaeri-flutter-release-aab-${{ github.sha }}
          path: apps/flutter/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
