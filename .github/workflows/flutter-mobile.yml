name: Flutter mobile checks

concurrency:
  group: flutter-mobile-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feat/flutter-mobile-foundation
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter-mobile.yml'
  pull_request:
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter-mobile.yml'
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run widget tests
        run: flutter test
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.alshaairy --project-name alshaeri .

      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: alshaeri-flutter-android-apk
          path: apps/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
