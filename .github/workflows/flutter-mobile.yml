name: Flutter mobile checks

on:
  push:
    branches:
      - feat/flutter-mobile-foundation
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter-mobile.yml'
  pull_request:
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter-mobile.yml'
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run widget tests
        run: flutter test
